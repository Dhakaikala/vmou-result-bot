name: VMOU Instant Universal Tracker

on:
  schedule:
    - cron: '*/15 * * * *' # हर 15 मिनट में ऑटोमैटिक चेक करेगा
  workflow_dispatch: # मैन्युअल रूप से रन करने के लिए

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions-user@users.noreply.github.com"
          git add last_seen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last seen updates history" && git push)
