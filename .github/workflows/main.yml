name: VMOU Instant Universal Tracker

on:
  schedule:
    - cron: '*/5 * * * *' # हर 5 मिनट में सभी साइट्स/रीजनल सेंटर्स की जाँच करेगा
  workflow_dispatch: # मैन्युअल रूप से 'Run workflow' करने के लिए बटन

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          VMOU_CHANNEL_ID: ${{ secrets.VMOU_CHANNEL_ID }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions-user@users.noreply.github.com"
          git add last_seen.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update last seen VMOU updates" &&
            git pull --rebase origin HEAD &&
            git push
          )
